# Self-contained production Mac mini example for hermes-wiki.
#
# Persistent user data is bind-mounted into /Users/Shared/hermes by default:
# - ${HERMES_HOME_DIR} keeps Hermes config, auth, sessions, logs, and plugin enablement.
# - ${HERMES_WORKSPACE_DIR} keeps wiki workspaces and source documents.
# - ${OPEN_WEBUI_DATA_DIR} keeps Open WebUI users, chats, uploads, and cache assets.
#
# Runtime internals stay in Docker named volumes:
# - hermes-agent-src stores the Hermes Agent runtime from the image.
# - hermes-webui-venv stores the WebUI Python environment.

services:
  hermes-agent-src-init:
    image: nousresearch/hermes-agent:main
    restart: "no"
    command: version
    volumes:
      - hermes-agent-src:/opt/hermes
    networks:
      - hermes-private

  hermes-agent:
    image: nousresearch/hermes-agent:main
    restart: unless-stopped
    depends_on:
      hermes-agent-src-init:
        condition: service_completed_successfully
    command:
      - gateway
      - run
    shm_size: ${HERMES_SHM_SIZE:-1g}
    working_dir: /workspace
    ports:
      - "${HERMES_DASHBOARD_BIND_IP:-127.0.0.1}:${HERMES_DASHBOARD_HOST_PORT:-9119}:9119"
    volumes:
      - hermes-agent-src:/opt/hermes
      - ${HERMES_HOME_DIR:-/Users/Shared/hermes/home}:/opt/data/profiles/default
      - ${HERMES_WORKSPACE_DIR:-/Users/Shared/hermes/workspace}:/workspace
    environment:
      HERMES_HOME: /opt/data/profiles/default
      HERMES_UID: ${HERMES_UID:-501}
      HERMES_GID: ${HERMES_GID:-20}
      MESSAGING_CWD: /workspace
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_MODEL_NAME: hermes-agent
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY to a random secret}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_TUI: "0"
    expose:
      - "8642"
      - "9119"
    networks:
      - hermes-private

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    restart: unless-stopped
    depends_on:
      hermes-agent-src-init:
        condition: service_completed_successfully
      hermes-agent:
        condition: service_started
    command:
      - bash
      - -lc
      - |
        mkdir -p /app/venv
        chown -R "$${WANTED_UID:-501}:$${WANTED_GID:-20}" /app/venv
        until [ -f /home/hermeswebui/.hermes/hermes-agent/pyproject.toml ]; do
          echo "Waiting for Hermes Agent source volume..."
          sleep 2
        done
        exec /hermeswebui_init.bash
    ports:
      - "${HERMES_WEBUI_BIND_IP:-127.0.0.1}:${HERMES_WEBUI_PORT:-8787}:8787"
    shm_size: ${HERMES_SHM_SIZE:-1g}
    volumes:
      - ${HERMES_HOME_DIR:-/Users/Shared/hermes/home}:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
      - hermes-webui-venv:/app/venv
      - ${HERMES_WORKSPACE_DIR:-/Users/Shared/hermes/workspace}:/workspace
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HERMES_CONFIG_PATH: /home/hermeswebui/.hermes/config.yaml
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui_state
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      HERMES_SKIP_CHMOD: ${HERMES_SKIP_CHMOD:-1}
      WANTED_UID: ${HERMES_UID:-501}
      WANTED_GID: ${HERMES_GID:-20}
    networks:
      - hermes-private

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main-slim}
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_started
    ports:
      - "${OPEN_WEBUI_BIND_IP:-127.0.0.1}:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - ${OPEN_WEBUI_DATA_DIR:-/Users/Shared/hermes/open-webui}:/app/backend/data
    environment:
      WEBUI_URL: ${OPEN_WEBUI_URL:-http://127.0.0.1:3000}
      WEBUI_NAME: ${OPEN_WEBUI_NAME:-RubikLab Chat}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:?Set OPEN_WEBUI_SECRET_KEY to a random secret}
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://hermes-agent:8642/v1
      OPENAI_API_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY to a random secret}
    networks:
      - hermes-private

networks:
  hermes-private:
    driver: bridge

volumes:
  hermes-agent-src:
  hermes-webui-venv:

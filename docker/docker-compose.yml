# Default stack: one Hermes Agent runtime container using ./data/hermes-home,
# kept alive for manual
# `docker compose exec` sessions, plus one Hermes WebUI instance.

services:
  hermes-agent-src-init:
    image: nousresearch/hermes-agent:main
    restart: "no"
    command: version
    volumes:
      - hermes-agent-src:/opt/hermes
    networks:
      - ai-internal

  hermes-agent:
    image: nousresearch/hermes-agent:main
    container_name: hermes-agent
    restart: unless-stopped
    depends_on:
      hermes-agent-src-init:
        condition: service_completed_successfully
    command:
      - sh
      - -lc
      - |
        set -eu
        uv pip install --python /opt/hermes/.venv/bin/python -r /opt/data/plugins/hermes-wiki/requirements.txt
        /opt/hermes/.venv/bin/hermes plugins enable hermes-wiki
        exec /opt/hermes/.venv/bin/hermes gateway run
    shm_size: ${HERMES_SHM_SIZE}
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_HOST_PORT}:9119"
    volumes:
      - ./data/hermes-home:/opt/data
      - hermes-agent-src:/opt/hermes
      - ..:/opt/data/plugins/hermes-wiki:ro
      - ./data/hermes-home/workspace:/workspace
      - ./data/hermes-home/workspace:/opt/data/workspace
    environment:
      HERMES_HOME: /opt/data
      TERMINAL_CWD: /workspace
      HERMES_UID: ${HERMES_UID}
      HERMES_GID: ${HERMES_GID}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_TUI: "0"
    networks:
      - ai-internal

  hermes-webui-plugin-deps:
    image: ghcr.io/nesquena/hermes-webui:latest
    restart: "no"
    user: "0"
    depends_on:
      hermes-agent-src-init:
        condition: service_completed_successfully
    command:
      - sh
      - -lc
      - |
        set -eu
        if [ ! -x /app/venv/bin/python3 ]; then
          uv venv /app/venv
        fi
        uv pip install --python /app/venv/bin/python3 'hermes-agent[web]==0.14.0'
        uv pip install --python /app/venv/bin/python3 -r /opt/hermes-wiki-src/requirements.txt
        chown -R "$${WANTED_UID}:$${WANTED_GID}" /app/venv
    volumes:
      - ./data/hermes-home/:/home/hermeswebui/.hermes
      - ..:/opt/hermes-wiki-src:ro
      - hermes-webui-venv:/app/venv
    environment:
      WANTED_UID: ${HERMES_UID}
      WANTED_GID: ${HERMES_GID}
    networks:
      - ai-internal

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:latest
    container_name: hermes-webui
    restart: unless-stopped
    user: "0"
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /home/hermeswebui/.hermes/plugins
        rm -rf /home/hermeswebui/.hermes/plugins/hermes-wiki
        ln -s /opt/hermes-wiki-src /home/hermeswebui/.hermes/plugins/hermes-wiki
        exec /hermeswebui_init.bash
    depends_on:
      hermes-agent-src-init:
        condition: service_completed_successfully
      hermes-agent:
        condition: service_started
      hermes-webui-plugin-deps:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HERMES_WEBUI_PORT}:8787"
    volumes:
      - ./data/hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent
      - ..:/opt/hermes-wiki-src:ro
      - hermes-webui-venv:/app/venv
      - ./data/hermes-home/workspace:/workspace
      - ./data/hermes-home/workspace:/opt/data/workspace
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HERMES_CONFIG_PATH: /home/hermeswebui/.hermes/config.yaml
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui_state
      HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
      TERMINAL_CWD: /workspace
      WANTED_UID: ${HERMES_UID}
      WANTED_GID: ${HERMES_GID}
      HERMES_SKIP_CHMOD: "1"
    networks:
      - ai-internal

networks:
  ai-internal:
    driver: bridge

volumes:
  hermes-agent-src:
  hermes-webui-venv:
